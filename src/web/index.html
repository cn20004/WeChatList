<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>WeChatList Node.js</title>
  <style>
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f7f9;margin:0;color:#1f2328}
    main{max-width:1180px;margin:40px auto;padding:0 20px}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:24px;box-shadow:0 8px 24px rgba(0,0,0,.04);margin-bottom:22px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
    textarea{width:100%;box-sizing:border-box;min-height:180px;border:1px solid #d0d7de;border-radius:10px;padding:12px;font:14px/1.5 ui-monospace,monospace}
    button{border:0;border-radius:10px;padding:10px 18px;cursor:pointer;background:#111827;color:#fff;font-weight:600}
    button.secondary{background:#475467}
    button.danger{background:#b42318}
    button:disabled{opacity:.5;cursor:not-allowed}
    .row{display:flex;gap:12px;align-items:center;margin-top:14px;flex-wrap:wrap}
    input,select{padding:9px 10px;border:1px solid #d0d7de;border-radius:8px}
    input[type=text]{min-width:260px}
    pre{white-space:pre-wrap;word-break:break-word;background:#0d1117;color:#e6edf3;border-radius:12px;padding:16px;max-height:520px;overflow:auto}
    small{color:#667085}
    .formats label{margin-right:12px;white-space:nowrap}
    .hint{background:#f8fafc;border:1px solid #e5e7eb;padding:10px 12px;border-radius:10px}
    .job{border:1px solid #e5e7eb;border-radius:12px;padding:14px;margin:10px 0}
    .job-head{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}
    .bar{height:10px;background:#eef2f6;border-radius:99px;overflow:hidden;margin:10px 0}
    .bar>span{display:block;height:100%;background:#111827;width:0%}
    .muted{color:#667085}
    .status{font-weight:700}
  </style>
</head>
<body>
<main>
  <h1>WeChatList Node.js</h1>
  <p>公众号历史文章采集、关键词筛选、资源下载、多格式导出。</p>

  <div class="card">
    <h2>登录状态</h2>
    <div class="row">
      <button id="healthRun">检查状态</button>
      <span>本机扫码登录：<code>npm run auth</code></span>
    </div>
    <pre id="healthOut">等待检查…</pre>
  </div>

  <div class="card">
    <h2>按公众号采集全部历史文章</h2>
    <div class="grid">
      <label>公众号名称<br><input id="keyword" type="text" placeholder="例如：机器之心"></label>
      <label>最多文章数（0=全部）<br><input id="limit" type="number" min="0" value="0"></label>
      <label>标题/摘要关键词<br><input id="filterKeyword" type="text" placeholder="可留空"></label>
      <label>起始日期<br><input id="fromDate" type="date"></label>
      <label>结束日期<br><input id="toDate" type="date"></label>
      <label>保存目录<br><input id="accountDirectory" type="text" value="accounts"></label>
    </div>

    <h3>导出格式</h3>
    <div class="formats">
      <label><input type="checkbox" name="accountFormat" value="json" checked> JSON</label>
      <label><input type="checkbox" name="accountFormat" value="markdown" checked> Markdown</label>
      <label><input type="checkbox" name="accountFormat" value="html" checked> HTML</label>
      <label><input type="checkbox" name="accountFormat" value="docx"> Word</label>
      <label><input type="checkbox" name="accountFormat" value="xlsx" checked> Excel 汇总</label>
      <label><input type="checkbox" name="accountFormat" value="pdf"> PDF</label>
      <label><input type="checkbox" name="accountFormat" value="jpg"> JPG</label>
    </div>

    <div class="row">
      <label><input id="accountAssets" type="checkbox" checked> 下载封面/图片/音频/音乐资源</label>
      <label><input id="accountZip" type="checkbox" checked> 每篇文章打 ZIP</label>
      <button id="accountRun">创建公众号采集任务</button>
    </div>
    <p class="hint"><small>大批量任务会进入后台队列；页面关闭后任务仍会继续。PDF/JPG 需要设置 CHROME_EXECUTABLE_PATH。</small></p>
    <pre id="accountOut">等待操作…</pre>
  </div>

  <div class="card">
    <h2>按文章链接批量采集</h2>
    <textarea id="urls" placeholder="https://mp.weixin.qq.com/s/...
https://mp.weixin.qq.com/s/..."></textarea>

    <div class="grid">
      <label>并发<br><input id="concurrency" type="number" min="1" max="10" value="3"></label>
      <label>保存目录<br><input id="directory" type="text" value="articles"></label>
    </div>

    <h3>导出格式</h3>
    <div class="formats">
      <label><input type="checkbox" name="urlFormat" value="json" checked> JSON</label>
      <label><input type="checkbox" name="urlFormat" value="markdown" checked> Markdown</label>
      <label><input type="checkbox" name="urlFormat" value="html" checked> HTML</label>
      <label><input type="checkbox" name="urlFormat" value="docx"> Word</label>
      <label><input type="checkbox" name="urlFormat" value="pdf"> PDF</label>
      <label><input type="checkbox" name="urlFormat" value="jpg"> JPG</label>
    </div>

    <div class="row">
      <label><input id="assets" type="checkbox" checked> 下载资源</label>
      <label><input id="zip" type="checkbox" checked> ZIP 打包</label>
      <button id="run">创建链接采集任务</button>
    </div>

    <pre id="out">等待操作…</pre>
  </div>

  <div class="card">
    <div class="job-head">
      <div>
        <h2>任务中心</h2>
        <div class="muted">实时查看进度、取消、失败后重试。</div>
      </div>
      <button id="jobsRefresh" class="secondary">刷新任务</button>
    </div>
    <div id="jobs"></div>
  </div>
</main>

<script>
function checkedValues(name) {
  return [...document.querySelectorAll(`input[name="${name}"]:checked`)].map(el => el.value);
}

function pretty(value) {
  return JSON.stringify(value, null, 2);
}

async function api(url, options = {}) {
  const response = await fetch(url, options);
  const data = await response.json();
  if (!response.ok) {
    throw new Error(data.error || `HTTP ${response.status}`);
  }
  return data;
}

const healthRun = document.querySelector("#healthRun");
const healthOut = document.querySelector("#healthOut");
healthRun.addEventListener("click", async () => {
  try {
    healthOut.textContent = pretty(await api("/api/wechat/health"));
  } catch (error) {
    healthOut.textContent = String(error);
  }
});

const run = document.querySelector("#run");
const out = document.querySelector("#out");
run.addEventListener("click", async () => {
  const urls = document.querySelector("#urls").value
    .split(/\r?\n/)
    .map(v => v.trim())
    .filter(Boolean);

  if (!urls.length) {
    out.textContent = "请至少输入一个公众号文章链接。";
    return;
  }

  run.disabled = true;
  out.textContent = "正在创建任务…";

  try {
    const job = await api("/api/wechat/jobs/urls-collect", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        urls,
        concurrency: Number(document.querySelector("#concurrency").value || 3),
        save: true,
        formats: checkedValues("urlFormat"),
        directory: document.querySelector("#directory").value || "articles",
        assets: document.querySelector("#assets").checked,
        zip: document.querySelector("#zip").checked
      })
    });

    out.textContent = `任务已创建：${job.id}`;
    await refreshJobs();
  } catch (error) {
    out.textContent = String(error);
  } finally {
    run.disabled = false;
  }
});

const accountRun = document.querySelector("#accountRun");
const accountOut = document.querySelector("#accountOut");
accountRun.addEventListener("click", async () => {
  const keyword = document.querySelector("#keyword").value.trim();
  if (!keyword) {
    accountOut.textContent = "请输入公众号名称。";
    return;
  }

  const limit = Number(document.querySelector("#limit").value || 0);
  const from = document.querySelector("#fromDate").value || null;
  const toRaw = document.querySelector("#toDate").value || null;
  const to = toRaw ? `${toRaw}T23:59:59` : null;

  accountRun.disabled = true;
  accountOut.textContent = "正在创建任务…";

  try {
    const job = await api("/api/wechat/jobs/account-collect", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        keyword,
        list: {
          limit,
          maxPages: 0,
          count: 20
        },
        filter: {
          keyword: document.querySelector("#filterKeyword").value.trim(),
          from,
          to
        },
        collect: {
          concurrency: 2,
          save: true,
          formats: checkedValues("accountFormat"),
          directory: document.querySelector("#accountDirectory").value || "accounts",
          assets: document.querySelector("#accountAssets").checked,
          zip: document.querySelector("#accountZip").checked
        }
      })
    });

    accountOut.textContent = `任务已创建：${job.id}`;
    await refreshJobs();
  } catch (error) {
    accountOut.textContent = String(error);
  } finally {
    accountRun.disabled = false;
  }
});

async function jobAction(id, action) {
  await api(`/api/wechat/jobs/${id}/${action}`, { method: "POST" });
  await refreshJobs();
}

function renderJob(job) {
  const progress = job.progress || {};
  const percent = Number(progress.percent || 0);
  const resultSummary = job.result
    ? `<details><summary>查看结果</summary><pre>${escapeHtml(pretty(job.result))}</pre></details>`
    : "";
  const error = job.error
    ? `<div style="color:#b42318;margin-top:8px">${escapeHtml(job.error)}</div>`
    : "";

  const canCancel = ["queued","running"].includes(job.status);
  const canRetry = ["failed","cancelled"].includes(job.status);

  return `
    <div class="job">
      <div class="job-head">
        <div>
          <div class="status">${escapeHtml(job.type)} · ${escapeHtml(job.status)}</div>
          <div class="muted">${escapeHtml(job.id)}</div>
        </div>
        <div class="row">
          ${canCancel ? `<button class="danger" onclick="jobAction('${job.id}','cancel')">取消</button>` : ""}
          ${canRetry ? `<button class="secondary" onclick="jobAction('${job.id}','retry')">重试</button>` : ""}
        </div>
      </div>
      <div class="bar"><span style="width:${Math.max(0,Math.min(100,percent))}%"></span></div>
      <div>${escapeHtml(progress.stage || "")} · ${progress.current ?? 0}/${progress.total ?? "?"} · ${percent}%</div>
      <div class="muted">${escapeHtml(progress.message || "")}</div>
      ${error}
      ${resultSummary}
    </div>
  `;
}

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

async function refreshJobs() {
  const container = document.querySelector("#jobs");
  try {
    const jobs = await api("/api/wechat/jobs?limit=50");
    container.innerHTML = jobs.length
      ? jobs.map(renderJob).join("")
      : '<div class="muted">暂无任务</div>';
  } catch (error) {
    container.textContent = String(error);
  }
}

document.querySelector("#jobsRefresh").addEventListener("click", refreshJobs);
refreshJobs();
setInterval(refreshJobs, 3000);
</script>
</body>
</html>
